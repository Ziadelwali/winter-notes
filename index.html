<style>
:root{--bg:#EEF2F3;--card:#fff;--ink:#0B1416;--ink2:#41535A;--ink3:#71858C;
--line:#D2DBDD;--sunk:#E2E8EA;--lake:#12708A;--ember:#A9382A;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#080D0F;--card:#111A1E;--ink:#E8EFF1;
--ink2:#A9BAC0;--ink3:#77898F;--line:#223035;--sunk:#0C1417;--lake:#4FB5D2;
--ember:#F0806A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
background:var(--bg);color:var(--ink);
font:15px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
border-radius:16px;padding:26px 24px;
box-shadow:0 1px 2px rgba(11,20,22,.05),0 10px 30px rgba(11,20,22,.08)}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 6px}
h1{font-size:21px;margin:0 0 6px;letter-spacing:-.018em}
p.sub{margin:0 0 18px;color:var(--ink2);font-size:13.5px}
input{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:10px;
padding:12px 13px;font-size:16px;color:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
input:focus{outline:none;border-color:var(--lake);background:var(--card)}
button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;
background:var(--lake);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:18px;margin:10px 0 0;font-size:12.5px;color:var(--ember)}
.hint{margin:16px 0 0;font-size:11.5px;color:var(--ink3);line-height:1.5}
</style></head><body>
<main class="card">
 <p class="eyebrow">Locked</p>
 <h1>Private page</h1>
 <p class="sub">Enter the passphrase to continue.</p>

   spellcheck="false" placeholder="Passphrase" aria-label="Passphrase">
  <button id="b" type="submit">Unlock</button>
 </form>
 <p class="msg" id="m" role="status"></p>
</main>

function b2a(s){var r=atob(s),u=new Uint8Array(r.length);
 for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z]+/g,' ').trim();}
function forget(){try{localStorage.removeItem(LS);}catch(e){}}
try{addEventListener('hashchange',function(){if(location.hash==='#forget'){forget();location.reload();}});}catch(e){}

function unlock(pass,quiet){
 return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
 .then(function(k){return crypto.subtle.deriveKey(
   {name:'PBKDF2',salt:b2a(SALT),iterations:ITER,hash:'SHA-256'},k,

 .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},k,b2a(DATA));})

   try{localStorage.setItem(LS,pass);}catch(e){}
